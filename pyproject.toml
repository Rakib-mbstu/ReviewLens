[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewlens"
version = "0.1.0"
description = "An LLM-based Java pull request reviewer, evaluated against real human review comments on merged PRs."
readme = "Readme.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mir Rakibul Islam" }]
keywords = ["code-review", "llm", "ai4se", "llm-as-a-judge", "empirical-software-engineering"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["httpx>=0.27,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.urls]
Homepage = "https://github.com/Rakib-mbstu/ReviewLens"
"Technical report" = "https://github.com/Rakib-mbstu/ReviewLens/blob/main/reports/technical-report.md"

[tool.setuptools.packages.find]
include = ["reviewlens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
