name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.9 is not a default choice — it is the interpreter every number in
      # reports/ was produced on, and requirements.txt pins the closure that
      # resolved under it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The suite is network-free by construction: matching, metrics and cache
      # keys are exercised against fixtures, never against a live API. If a test
      # ever needs a key or a socket here, that is the bug.
      - name: Run tests
        run: pytest -q
